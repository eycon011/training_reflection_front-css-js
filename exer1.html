<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino de Reflexos</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Treino de Reflexo Rápido</h1>
    </header>

    <main class="container-jogo">
        <p class="status-jogo">
            Tempo restante: <span id="tempo">10</span>s | Pontos: <span id="pontos">0</span>
        </p>

        <button id="btnIniciar">Iniciar Desafio</button>

        <!-- Contêiner do jogo usando <section> e <span> para o alvo -->
        <section id="areaJogo" class="area-jogo">
            <span id="alvo" class="alvo-circulo"></span>
        </section>
    </main>

    <script src="script/exer1.js"></script>
</body>

</html>
